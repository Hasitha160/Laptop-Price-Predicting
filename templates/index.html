<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Laptop Price Predictor</title>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <div class="title">💻 Laptop Price Predictor</div>
            <p class="subtitle">Fill in the specs below to estimate the laptop price</p>
        </div>

        <form action="/" method="POST">
            <div class="form">

                <div class="form-row">
                    <div class="inputfield">
                        <label for="ram">RAM (GB)</label>
                        <input class="input" type="number" name="ram" placeholder="e.g. 8" required>
                    </div>
                    <div class="inputfield">
                        <label for="weight">Weight (Kg)</label>
                        <input class="input" type="number" step="0.01" name="weight" placeholder="e.g. 1.5" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="inputfield">
                        <label for="company">Company</label>
                        <select name="company" id="company" required>
                            <option value="" selected hidden>Select brand</option>
                            <option value="acer">Acer</option>
                            <option value="apple">Apple</option>
                            <option value="asus">Asus</option>
                            <option value="dell">Dell</option>
                            <option value="hp">HP</option>
                            <option value="lenovo">Lenovo</option>
                            <option value="msi">MSI</option>
                            <option value="toshiba">Toshiba</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="inputfield">
                        <label for="typename">Type</label>
                        <select name="typename" id="typename" required>
                            <option value="" selected hidden>Select type</option>
                            <option value="2in1convertible">2-in-1 Convertible</option>
                            <option value="gaming">Gaming</option>
                            <option value="netbook">Netbook</option>
                            <option value="notebook">Notebook</option>
                            <option value="ultrabook">Ultrabook</option>
                            <option value="workstation">Workstation</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="inputfield">
                        <label for="opsys">Operating System</label>
                        <select name="opsys" id="opsys" required>
                            <option value="" selected hidden>Select OS</option>
                            <option value="windows">Windows</option>
                            <option value="mac">macOS</option>
                            <option value="linux">Linux</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="inputfield">
                        <label for="cpuname">CPU</label>
                        <select name="cpuname" id="cpuname" required>
                            <option value="" selected hidden>Select CPU</option>
                            <option value="intelcorei3">Intel Core i3</option>
                            <option value="intelcorei5">Intel Core i5</option>
                            <option value="intelcorei7">Intel Core i7</option>
                            <option value="amd">AMD</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="inputfield full-width">
                    <label for="gpuname">GPU</label>
                    <select name="gpuname" id="gpuname" required>
                        <option value="" selected hidden>Select GPU</option>
                        <option value="intel">Intel</option>
                        <option value="amd">AMD</option>
                        <option value="nvidia">Nvidia</option>
                    </select>
                </div>

                <div class="check">
                    <label class="checkbox-label">
                        <input type="checkbox" name="touchscreen">
                        <span class="checkmark"></span>
                        Touch Screen
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="ips">
                        <span class="checkmark"></span>
                        IPS Display
                    </label>
                </div>

                <div class="inputfield full-width">
                    <input class="btn" type="submit" value="Predict Price">
                </div>

            </div>
        </form>

        {% if pred_value != 0 %}
        <div class="result">
            <span class="result-label">Estimated Price</span>
            <span class="result-value">LKR {{ pred_value }}</span>
        </div>
        {% endif %}
    </div>
</body>
</html>
